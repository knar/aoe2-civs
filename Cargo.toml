[package]
name = "aoe2-civs"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
js-sys = "0.3"
sortable-js = "0.1"
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "HtmlElement", "HtmlInputElement", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Storage"] }
