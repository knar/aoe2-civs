<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aoe2 civ filter</title>
    <link data-trunk rel="copy-file" href="assets/favicon.svg" />
    <link data-trunk rel="copy-file" href="assets/favicon.ico" />
    <link data-trunk rel="copy-file" href="assets/favicon-16.png" />
    <link data-trunk rel="copy-file" href="assets/favicon-32.png" />
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" />
    <link id="favicon" rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      if (
        localStorage.getItem("aoe2.darkMode") === "1" ||
        (localStorage.getItem("aoe2.darkMode") === null &&
          matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link data-trunk rel="rust" data-bin="aoe2-civs" data-wasm-opt="z" data-keep-going="false" />
    <link data-trunk rel="css" href="styles.css" />
  </head>
  <body></body>
</html>
